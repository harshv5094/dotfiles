# Enable mouse mode (pane switching, resizing, scrolling)
set -g mouse on

# Set default terminal to xterm-256color or tmux-256color
set -g default-terminal "xterm-256color"

# Enable true color support
set-option -sa terminal-features ',xterm-256color:RGB'

# Start window and pane numbering from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Split panes using - and |
bind | split-window -h -c "#{pane_current_path}" # Horizontal split
bind - split-window -v -c "#{pane_current_path}" # Vertical split
unbind '"'
unbind %

# --- Pane Navigation (Vim-style) ---
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Pane Resizing (Repeatable) ---
# The -r flag allows you to tap the key multiple times without hitting the prefix again
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# --- Window Navigation ---
# Quick movement between windows
bind-key -r C-p select-window -t :-
bind-key -r C-n select-window -t :+

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Tmux Sessionizer Script
bind-key -r f run-shell "tmux neww ~/bin/tsession"

# Enable vi keys in copy mode
set-window-option -g mode-keys vi

# Set clock mode to 12 hours
setw -g clock-mode-style 12

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h85% -E lazygit

# Display rmpc
bind -r M display-popup -w80% -h85% -E rmpc

# --- Status Bar General ---
set -g status-position bottom
set -g status-style "bg=color0,fg=color15"
set -g message-style "fg=color15,bg=color0,bold"

# --- Left Side: Session Name ---
set-option -g status-left-length 200
set-option -g status-left " [#S] "

# --- Right Side: Git Branch + Prefix + Clock ---
set -g status-right "#{prefix_highlight} %d-%b-%y | #H "

# --- Inactive Window Format ---
set-option -g window-status-style "fg=color7"
set-option -g window-status-format "#I:#W #F"

# --- Active Window Format ---
set-option -g window-status-current-style "fg=color15,bold"
set-option -g window-status-current-format "#I:#W #F"

# --- Activity & Last Window Styles ---
set-option -g window-status-last-style "fg=color8"
set-option -g window-status-activity-style "fg=color7"

# Setup mac os config
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# Clone the tmux plugin manager
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# tpm - tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @prefix_highlight_fg 'color15'
set -g @prefix_highlight_bg 'color0'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt 'COPY'
set -g @prefix_highlight_sync_prompt 'SYNC'

# Initialize tpm
run '~/.tmux/plugins/tpm/tpm'
