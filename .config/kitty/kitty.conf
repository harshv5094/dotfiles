# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size 13

# Use system default shell
shell .
# Use system default editor
editor .
# Adjust clipboard max size
clipboard_max_size 1024
# Directly close the tab
confirm_os_window_close 0

include kitty.d/appearance.conf
include kitty.d/mappings.conf
include kitty.d/misc.conf
