customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#fabd2f"
      - bold
    inactiveBorderColor:
      - "#a89984"
    searchingActiveBorderColor:
      - "#fe8019"
    optionsTextColor:
      - "#83a598"
    selectedLineBgColor:
      - "#3c3836"
    cherryPickedCommitFgColor:
      - "#8ec07c"
    cherryPickedCommitBgColor:
      - "#458588"
    markedBaseCommitFgColor:
      - "#fabd2f"
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
os:
  editPreset: "nvim-remote"
